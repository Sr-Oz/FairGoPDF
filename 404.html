<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="The Dato Family Labs">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title>Page not found | FairGo PDF</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Pliant:wght@700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<header class="site-header">
  <div class="container">
    <a href="/" class="logo"><img src="/assets/img/logo-light.svg" alt="FairGo PDF Logo" class="logo-img logo-img-light"><img src="/assets/img/logo-dark.svg" alt="FairGo PDF Logo" class="logo-img logo-img-dark"></a>
    <div class="header-right">
      <a href="/support/" class="header-support-btn" aria-label="Shout us a coffee, support this project">
        <span class="material-symbols-outlined" aria-hidden="true">coffee</span>
        <span class="header-support-btn-label">Shout a Coffee</span>
      </a>
      <button class="icon-btn" id="searchToggle" type="button" aria-label="Search the site">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark mode">
        <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
      </button>
    </div>
  </div>
</header>
<main id="main-content">
  <section class="glitch-hero" style="background-image: url('/assets/img/404-bg.jpg');">
    <div class="glitch-hero-overlay"></div>
    <div class="container glitch-hero-content">
      <p class="glitch-hero-eyebrow">Lost, mate?</p>
      <h1 class="glitch-text" data-text="404">404</h1>
      <p class="glitch-hero-sub">That page hopped off somewhere, it's not here. Let's get you back on track.</p>
      <div class="actions-row" style="justify-content:center;">
        <a class="btn" href="/">Back to all tools</a>
        <a class="btn secondary" href="/#pdf-tools">Browse PDF Tools</a>
      </div>
    </div>
  </section>
</main>
<script src="/assets/search-data.js"></script>
<script src="/assets/search.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
