<div class="contact-form-card">
  <form id="contactForm" novalidate>
    <div class="field" style="margin-bottom: 16px;">
      <label for="cfName">Full name</label>
      <input type="text" id="cfName" name="name" autocomplete="name" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--text); font-size:0.95rem;">
      <p class="field-error" id="cfNameError" hidden></p>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label for="cfEmail">Email address</label>
      <input type="email" id="cfEmail" name="email" autocomplete="email" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--text); font-size:0.95rem;">
      <p class="field-error" id="cfEmailError" hidden></p>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label for="cfSubject">Subject</label>
      <input type="text" id="cfSubject" name="subject" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--text); font-size:0.95rem;">
      <p class="field-error" id="cfSubjectError" hidden></p>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label for="cfMessage">Message</label>
      <textarea id="cfMessage" name="message" rows="6" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt); color:var(--text); font-size:0.95rem; resize:vertical;"></textarea>
      <p class="field-error" id="cfMessageError" hidden></p>
    </div>

    <!-- Honeypot: real people never see or fill this in. Any bot that fills every
         field blindly will trip it, and the submission is quietly dropped. -->
    <div style="position:absolute; left:-9999px; top:-9999px;" aria-hidden="true">
      <label for="cfWebsite">Leave this field blank</label>
      <input type="text" id="cfWebsite" name="website_url" tabindex="-1" autocomplete="off">
    </div>

    <div class="field" style="margin-bottom: 16px; align-items: center;">
      <div class="h-captcha" data-captcha="true" id="hcaptchaWidget"></div>
      <script>
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('hcaptchaWidget').setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      </script>
      <p class="field-error" id="cfCaptchaError" hidden></p>
    </div>

    <div class="actions-row">
      <button class="btn" id="cfSubmit" type="submit" style="width:100%;">Send Message</button>
    </div>

    <div class="status-box" id="cfStatus"></div>
  </form>
</div>
