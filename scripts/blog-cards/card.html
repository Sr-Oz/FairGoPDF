<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<meta name="description" content="Template for the 1200 by 630 blog share images; rendered to PNG by ?post=slug&export=1 and not part of the site.">
<title>Blog card</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Hallmark · component: blog card (a 1200x630 image template, rendered to PNG) · genre: editorial · theme: project tokens, Golden Wattle (kept) · states: n/a, a static image · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: none, the ground, the page pattern and the notched edge are the blog's own, so a card and its post read as one thing */
/* Hallmark · waive 38iii · the highlighted word is the card's one accent and appears once, set as a block rather than a colour change · the og-card's .au and the wordmark's PDF set a word apart the same way */
/* Hallmark · dismissed 12, 13, 44 · an image template, not a page: there is no hero fold, and the card holds the headline, one sentence and the brand line */

/* Mirrors the values in assets/style.css and its blog block; this file is rendered alone, so it carries its own copy. */
:root {
  --bg: #f9f9f7;
  --brand: #004D40;
  --brand-dark: #00332B;
  --teal-deep: #004D40;
  --accent: #FFD700;
  --mint: #d6ebe5;
  --on-teal: #fff9f2;
  --on-accent: #00332B;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-heading: "Roboto Condensed", "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.cw-privacy { --cw-ground: var(--teal-deep); --cw-mark: var(--accent); --cw-ink: var(--on-teal); }
.cw-industries { --cw-ground: var(--accent); --cw-mark: var(--teal-deep); --cw-ink: var(--on-accent); }
.cw-guides { --cw-ground: var(--mint); --cw-mark: var(--brand); --cw-ink: var(--brand-dark); }

* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow-x: clip; background: var(--bg); }

.card {
  position: relative;
  isolation: isolate;
  width: 1200px;
  height: 630px;
  overflow: clip;
  padding: 56px 72px;
  background-color: var(--cw-ground);
  /* the dashed tear line, above the notched edge */
  background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--cw-ink) 45%, transparent) 0 14px, transparent 14px 28px);
  background-position: 0 calc(100% - 44px);
  background-size: 100% 3px;
  background-repeat: no-repeat;
  color: var(--cw-ink);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--cw-mark);
  opacity: 0.38;
  -webkit-mask-image: url(/assets/img/blog/page-pattern.svg), linear-gradient(100deg, transparent 30%, #000 92%);
  mask-image: url(/assets/img/blog/page-pattern.svg), linear-gradient(100deg, transparent 30%, #000 92%);
  -webkit-mask-size: 300px 360px, 100% 100%;
  mask-size: 300px 360px, 100% 100%;
  -webkit-mask-position: 40px 20px, 0 0;
  mask-position: 40px 20px, 0 0;
  -webkit-mask-repeat: repeat, no-repeat;
  mask-repeat: repeat, no-repeat;
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
}
.card::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 28px;
  background: radial-gradient(circle 14px at 50% 100%, var(--bg) 97%, transparent) 0 0 / 56px 28px repeat-x;
}

.mid { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 56px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.lockup { display: flex; align-items: center; gap: 16px; }
.lockup img { width: 48px; height: 48px; display: block; border-radius: 12px; }
.lockup span { font-family: var(--font-heading); font-weight: 700; font-size: 34px; letter-spacing: -0.01em; line-height: 1; }
.lockup span b { font-weight: 700; color: var(--cw-mark); }
.tag { padding: 8px 20px; border-radius: 999px; background: color-mix(in srgb, var(--cw-ink) 16%, transparent); font-weight: 700; font-size: 22px; line-height: 1; }

.headline {
  max-width: 820px;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 96px;
  line-height: 1.04;
  letter-spacing: -0.015em;
  overflow-wrap: break-word;
  min-width: 0;
}
.headline.m { font-size: 84px; }
.headline.s { font-size: 72px; }
.headline mark { padding: 0 12px; margin: 0 -12px; border-radius: 12px; background: var(--cw-mark); color: var(--cw-ground); -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.sub { margin-top: 24px; max-width: 1000px; font-weight: 600; font-size: 29px; line-height: 1.3; color: color-mix(in srgb, var(--cw-ink) 82%, transparent); }
.foot { position: absolute; left: 72px; bottom: 76px; font-weight: 600; font-size: 22px; line-height: 1; color: color-mix(in srgb, var(--cw-ink) 82%, transparent); }
</style>
</head>
<body>
<div class="card cw-privacy" id="card">
  <div class="top">
    <div class="lockup"><img src="/assets/img/favicon.svg" alt="" width="48" height="48"><span>FairGo<b>PDF</b></span></div>
    <div class="tag" id="tag">Privacy</div>
  </div>
  <div class="mid">
  <h1 class="headline" id="headline">They can&rsquo;t lose what they don&rsquo;t <mark>hold.</mark></h1>
  <p class="sub" id="sub">What this month&rsquo;s data breaches mean for your documents</p>
  </div>
  <p class="foot">100% client-side. Nothing is ever uploaded.</p>
</div>
<script>
// ?post=<slug> fills the card from posts.json (its group colourway, headline and sentence); ?export=1 then saves the PNG.
// Words in {braces} in a headline are set as the highlighted word.
(function () {
  var q = new URLSearchParams(location.search), slug = q.get("post");
  var LABEL = { privacy: "Privacy", industries: "Industries", guides: "PDF guides" };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var typo = function (s) { return s.replace(/'/g, "’"); };

  var ready = slug ? fetch("/scripts/blog-cards/posts.json").then(function (r) { return r.json(); }).then(function (all) {
    var p = all.filter(function (x) { return x.slug === slug; })[0];
    if (!p) return;
    $("card").className = "card cw-" + p.group;
    $("tag").textContent = LABEL[p.group];
    var plain = p.headline.replace(/[{}]/g, "");
    $("headline").innerHTML = esc(typo(p.headline)).replace(/\{(.+?)\}/g, "<mark>$1</mark>");
    $("headline").className = "headline" + (plain.length > 62 ? " s" : plain.length > 42 ? " m" : "");
    $("sub").textContent = typo(p.sub);
  }) : Promise.resolve();

  if (!q.has("export")) return;
  var b64 = function (buf) { var s = "", u = new Uint8Array(buf); for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  var font = function (family, file, weights) {
    return fetch("/assets/fonts/" + file).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      return "@font-face{font-family:'" + family + "';font-weight:" + weights + ";src:url(data:font/woff2;base64," + b64(buf) + ") format('woff2');}";
    });
  };
  var data = function (url, type) { return fetch(url).then(function (r) { return r.text(); }).then(function (s) { return "data:" + type + ";base64," + btoa(unescape(encodeURIComponent(s))); }); };

  // Saving: the card is drawn as an SVG image onto a canvas at exactly 1200 x 630 and posted to save-server.mjs, which writes
  // assets/img/blog/<slug>.png. An SVG drawn to a canvas cannot fetch anything, so the fonts, the logo and the page pattern are inlined.
  Promise.all([
    ready,
    font("Manrope", "manrope-latin.woff2", "400 800"),
    font("Roboto Condensed", "roboto-condensed-latin.woff2", "700 800"),
    data("/assets/img/favicon.svg", "image/svg+xml"),
    data("/assets/img/blog/page-pattern.svg", "image/svg+xml"),
    document.fonts.ready
  ]).then(function (parts) {
    var node = $("card").cloneNode(true);
    node.querySelector("img").setAttribute("src", parts[3]);
    var card = new XMLSerializer().serializeToString(node);
    var css = document.querySelector("style").textContent.replace(/url\(\/assets\/img\/blog\/page-pattern\.svg\)/g, "url(" + parts[4] + ")");
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><foreignObject width="1200" height="630">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" style="width:1200px;height:630px"><style><![CDATA[' + parts[1] + parts[2] + css + ']]></style>' + card + '</div></foreignObject></svg>';
    var img = new Image();
    img.onload = function () {
      var c = document.createElement("canvas");
      c.width = 1200; c.height = 630;
      c.getContext("2d").drawImage(img, 0, 0);
      c.toBlob(function (blob) {
        fetch("/__save?to=assets/img/blog/" + encodeURIComponent(slug || "card") + ".png", { method: "POST", body: blob })
          .then(function (r) { return r.text(); })
          .then(function (msg) { document.title = "saved: " + msg; });
      }, "image/png");
    };
    img.onerror = function () { document.title = "export failed"; };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
})();
</script>
</body>
</html>
