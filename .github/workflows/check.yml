name: Check site

# The header, footer, FAQ pages and font files are generated by scripts. This fails the build if one was forgotten,
# if a page has a broken link or invalid JSON-LD, or if a PDF helper's tests fail.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shared header and footer are in sync
        run: python3 scripts/sync-partials.py --check
      - name: FAQ pages are up to date
        run: |
          python3 scripts/build-faq.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Links, titles, JSON-LD and sitemap
        run: python3 scripts/check-site.py
      - name: Tests
        run: node --test "tests/*.test.mjs"
