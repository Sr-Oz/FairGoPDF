name: Check site

# The header, footer, FAQ pages and font files are generated by scripts. This fails the build if one was forgotten,
# if a page has a broken link or invalid JSON-LD, or if a PDF helper's tests fail.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the job's token may only read it. Without this line it gets whatever default the repository sets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the token is not left in .git/config for later steps to find
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shared header and footer are in sync
        run: python3 scripts/sync-partials.py --check
      - name: FAQ pages are up to date
        run: |
          python3 scripts/build-faq.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Pages match the Private mode switch
        run: python3 scripts/privacy_mode.py --check
      - name: Cloudflare redirects and headers match vercel.json
        run: python3 scripts/vercel-to-cloudflare.py --check
      - name: Links, titles, JSON-LD and sitemap
        run: python3 scripts/check-site.py
      - name: Tests
        run: node --test "tests/*.test.mjs"
